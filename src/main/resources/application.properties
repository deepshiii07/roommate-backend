spring.application.name=roomiesync-backend

# Local MySQL defaults. Override these with environment variables when needed.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/roomiesync?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:roomiesync}
spring.datasource.password=${DB_PASSWORD:roomiesync_local_dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}
